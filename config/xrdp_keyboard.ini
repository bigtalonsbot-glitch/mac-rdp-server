; xrdp keyboard mapping — standard US layout
; Windows sends scan codes; this maps them to keysyms

[default]
keyboard_type=4
keyboard_subtype=1
keylayout=0x0409

[default_rdp_layouts]
default_layout_without_shift=en-us
default_layout_with_shift=en-us-shift

; Map common Mac-specific keys so they work naturally
; Cmd key → Windows key passthrough
; Option  → Alt

[layouts_map]
/en-us/0x0409=en-us
