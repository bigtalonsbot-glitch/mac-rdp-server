[Globals]
ListenAddress=127.0.0.1
ListenPort=3350
EnableUserWindowManager=true
UserWindowManager=startwm.sh
DefaultWindowManager=startwm.sh
ReconnectScript=reconnect.sh

[Security]
AllowRootLogin=false
MaxLoginRetry=4
TerminalServerUsers=tsusers
TerminalServerAdmins=tsadmins
AlwaysGroupCheck=false

[Sessions]
MaxSessions=10
KillDisconnected=false
; Reconnect to an existing session rather than creating a new one
DisconnectedTimeLimit=0
IdleTimeLimit=0

[Logging]
LogFile=/opt/mac-rdp/var/log/sesman.log
LogLevel=WARNING
EnableSyslog=false

[Xvnc]
; Not used in VNC-bridge mode (we connect to existing macOS Screen Sharing)
; but kept for sesman compatibility
param=-bs
param=-ac
param=-nolisten
param=tcp
param=-localhost
