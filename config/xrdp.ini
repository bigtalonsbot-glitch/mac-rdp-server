[globals]
; TLS encryption — required for modern Windows RDP clients
security_layer=tls
certificate=/opt/mac-rdp/etc/xrdp/cert.pem
key_file=/opt/mac-rdp/etc/xrdp/key.pem

; Permit NLA (Network Level Authentication) with TLS
crypt_level=high
allow_channels=true
allow_multimon=true

; Bitmap performance settings
bitmap_cache=yes
bitmap_compression=yes
bulk_compression=yes
; Colour depth is the single biggest speed lever with the VNC bridge: xrdp's
; VNC module only receives raw pixels, so 16-bit halves every frame and uses
; xrdp's much faster 16-bit compressor. Switch with:  sudo ./rdpctl.sh quality fast|best
;   16 = fast (slight banding in gradients/photos)   32 = best colour (slower)
max_bpp=16

; RDP fastpath — bypasses legacy update path, biggest single latency win
use_fastpath=both

; Hardware cursor — server sends cursor shape to client, eliminates cursor lag
new_cursors=true

; Clipboard: bidirectional (Mac ↔ Windows)
use_compression=yes
channelpriority=low

; Log
log_file=/opt/mac-rdp/var/log/xrdp.log
log_level=WARNING
enable_console_log=false

; Port xrdp listens on
port=3389

; Do not fork — launchd manages the process
fork=yes
tcp_nodelay=yes
tcp_keepalive=yes

; ── Login screen theme ───────────────────────────────────────────────────────
ls_title=Mac RDP Server

; Outer background — dark navy fills the RDP window behind the dialog
ls_top_window_bg_color=1a2235

; Dialog box dimensions
ls_width=350
ls_height=430

; Dialog body — clean off-white
ls_bg_color=f4f6f9

; Logo: full-width dark header, flush to dialog top-left corner
ls_logo_filename=/opt/mac-rdp/share/xrdp/xrdp_logo.bmp
ls_logo_x_pos=0
ls_logo_y_pos=0

; Form fields — pushed down below the 155px header
ls_label_x_pos=30
ls_label_width=65
ls_input_x_pos=110
ls_input_width=210
ls_input_y_pos=180

; Buttons
ls_btn_ok_x_pos=142
ls_btn_ok_y_pos=370
ls_btn_ok_width=85
ls_btn_ok_height=30
ls_btn_cancel_x_pos=237
ls_btn_cancel_y_pos=370
ls_btn_cancel_width=85
ls_btn_cancel_height=30

[Logging]
LogFile=/opt/mac-rdp/var/log/xrdp.log
LogLevel=WARNING
EnableSyslog=false

[Channels]
; Clipboard redirect
rdpdr=true
; audio isn't carried by the VNC bridge, so don't negotiate it
rdpsnd=false
drdynvc=true
cliprdr=true


[xrdp1]
; The login screen asks for the Screen Sharing (VNC) password, which xrdp
; passes to macOS Screen Sharing. Do NOT hard-code it here: xrdp's VNC module
; ignores the username, so a stored password lets anyone on the network in.
; Set/change it with:  sudo ./rdpctl.sh setpassword
name=Mac Desktop
lib=libvnc.so
username=na
password=ask
ip=127.0.0.1
port=5900
enable_crypt=false
; (delay_ms is only a one-time wait before connecting to VNC, not a poll rate)
delay_ms=0
